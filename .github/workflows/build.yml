name: Build

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        run: bash scripts/build.sh

      - name: Pack release assets
        run: |
          mkdir -p release
          cp dist/linux-amd64/eudic-mcp-go release/eudic-mcp-go-linux-amd64
          cp dist/linux-arm64/eudic-mcp-go release/eudic-mcp-go-linux-arm64
          cp dist/windows-amd64/eudic-mcp-go.exe release/eudic-mcp-go-windows-amd64.exe
          chmod +x release/eudic-mcp-go-linux-*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
